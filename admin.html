<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N2P SHOP CONTROL</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#09070d;color:#fff}
    .login{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
    .login-box{width:100%;max-width:380px;background:#15101c;border:1px solid #563579;border-radius:18px;padding:30px;box-sizing:border-box}
    .login-box h1{color:#c77dff;margin-top:0}
    input{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #563579;background:#0d0912;color:#fff}
    button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:8px;background:#8b3dff;color:#fff;font-weight:bold;cursor:pointer}
    #loginError{color:#ff6b6b;margin-top:12px}
    header{padding:25px;background:#140d20;border-bottom:1px solid #3b2058}
    header h1{margin:0;color:#c77dff}
    header p{color:#aaa}
    .container{max-width:1100px;margin:auto;padding:25px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
    .box{background:#15101c;border:1px solid #332044;border-radius:14px;padding:20px}
    .box h3{margin-top:0;color:#aaa}
    .number{font-size:28px;font-weight:bold;color:#c77dff}
    .orders{margin-top:25px}
    .order{background:#15101c;border:1px solid #332044;border-radius:14px;padding:20px;margin-bottom:15px}
    .order-head{display:flex;justify-content:space-between;gap:10px}
    .status{background:#5b3a00;color:#ffd166;padding:6px 10px;border-radius:20px;font-size:13px}
    select{background:#0d0912;color:#fff;border:1px solid #563579;padding:8px;border-radius:8px}
    #statusFilters,#monthControls{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
    #statusFilters button,#monthControls button{width:auto;margin-top:0;padding:8px 14px;font-size:14px}
    .logout{width:auto;float:right;margin-top:-45px;padding:9px 15px}
    .current-month{color:#c77dff;font-weight:bold}
    #historySelect{display:none}
    @media(max-width:700px){.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="loginPage" class="login">
  <div class="login-box">
    <h1>N2P SHOP</h1>
    <p>เข้าสู่ระบบหลังบ้าน</p>
    <input type="email" id="email" placeholder="อีเมล">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <div id="loginError"></div>
  </div>
</div>

<div id="adminPage" style="display:none;">
  <header>
    <h1>N2P SHOP CONTROL</h1>
    <p>หลังบ้านจัดการออเดอร์</p>
    <button class="logout" onclick="logout()">ออกจากระบบ</button>
  </header>

  <div class="container">
    <div class="stats">
      <div class="box">
        <h3>ออเดอร์ของเดือน</h3>
        <div class="number" id="totalOrders">0</div>
      </div>
      <div class="box">
        <h3>ยอดขายของเดือน</h3>
        <div class="number" id="totalSales">฿0</div>
      </div>
      <div class="box">
        <h3>รอชำระเงิน</h3>
        <div class="number" id="waitingOrders">0</div>
      </div>
  <div class="box">
  <h3>ต้นทุนของเดือน</h3>
  <div class="number" id="totalCost">฿0</div>
</div>

<div class="box">
  <h3>กำไรของเดือน</h3>
  <div class="number" id="totalProfit">฿0</div>
</div>
      </div>
<div class="products">
  <h2>📦 จัดการสินค้า</h2>

  <div class="box">
    <h3>➕ เพิ่มสินค้าใหม่</h3>

<div class="product-form">

  <input id="productName" placeholder="ชื่อสินค้า">

  <input id="productImage" placeholder="ลิงก์รูปสินค้า">

  <input id="productPrice" type="number" placeholder="ราคาขาย">

  <input id="productCost" type="number" placeholder="ต้นทุน">

  <input id="productSizes" placeholder="ไซส์ เช่น S,M,L,XL">

  <input id="productColors" placeholder="สี เช่น ดำ,ขาว,เทา">

  <input
    id="productDescription"
    class="full"
    placeholder="รายละเอียดสินค้า"
  >

  <div class="product-actions full">
    <button onclick="addProduct()">➕ เพิ่มสินค้า</button>
  </div>

</div>
  </div>

  <div id="productsList" style="margin-top:20px;">
    กำลังโหลดสินค้า...
  </div>
</div>
    <div class="orders">
      <h2 id="ordersTitle">ออเดอร์เดือนปัจจุบัน</h2>
      <div id="monthControls">
        <button id="currentMonthBtn" onclick="showCurrentMonth()">📅 เดือนปัจจุบัน</button>
        <button id="historyBtn" onclick="showHistory()">🔎 ประวัติออเดอร์</button>
        <select id="historySelect" onchange="selectHistoryMonth(this.value)"></select>
      </div>

      <div id="statusFilters">
        <button onclick="filterOrders('ทั้งหมด')">ทั้งหมด</button>
        <button onclick="filterOrders('รอชำระเงิน')">รอชำระเงิน</button>
        <button onclick="filterOrders('กำลังเตรียมสินค้า')">กำลังเตรียมสินค้า</button>
        <button onclick="filterOrders('จัดส่งแล้ว')">จัดส่งแล้ว</button>
        <button onclick="filterOrders('เสร็จสิ้น')">เสร็จสิ้น</button>
      </div>

      <div id="ordersList">กำลังโหลด...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://sdcuzllpkjwoyklylhuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_9MKq7DSsnKbtUDy6VDZ1Vw_WiC-DCkQ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allOrders = [];
  let allProducts = [];
let selectedMonthKey = "";
let historyMode = false;
let lastMonthKey = "";

function monthKey(date){
  const d = new Date(date);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function monthLabel(key){
  const [year, month] = key.split("-").map(Number);
  return new Intl.DateTimeFormat("th-TH", {
    month:"long",
    year:"numeric"
  }).format(new Date(year, month-1, 1));
}

function currentMonthKey(){
  return monthKey(new Date());
}

// LOGIN
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signInWithPassword({email,password});

  if(error){
    document.getElementById("loginError").textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
    return;
  }

  document.getElementById("loginPage").style.display = "none";
  document.getElementById("adminPage").style.display = "block";
  showCurrentMonth();
  loadOrders();
  loadProducts();
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}
async function loadProducts(){
  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending:false });

  if(error){
    console.error(error);
    document.getElementById("productsList").innerHTML =
      "<p>ไม่สามารถโหลดสินค้าได้</p>";
    return;
  }

  allProducts = data || [];
  renderProducts();
}

function renderProducts(){

  if(!allProducts.length){
    document.getElementById("productsList").innerHTML =
      "<p>ยังไม่มีสินค้า</p>";
    return;
  }

  document.getElementById("productsList").innerHTML =
    allProducts.map(product => `
      <div class="order">

        ${product.image_url ? `
          <img
            src="${product.image_url}"
            style="width:120px;height:120px;object-fit:cover;border-radius:10px;"
          >
        ` : ""}

        <h3>${product.name}</h3>

        <p>💰 ราคาขาย: ฿${Number(product.price).toLocaleString("th-TH")}</p>
        <p>💵 ต้นทุน: ฿${Number(product.cost).toLocaleString("th-TH")}</p>

        <p>${product.description || ""}</p>

        <p>
          ${product.active ? "🟢 เปิดขาย" : "🔴 ปิดขาย"}
        </p>

        <button
          onclick="toggleProduct('${product.id}', ${product.active})"
        >
          ${product.active ? "ปิดการขาย" : "เปิดการขาย"}
        </button>

        <button
          onclick="deleteProduct('${product.id}')"
          style="background:#8b1e1e;"
        >
          🗑 ลบสินค้า
        </button>

      </div>
    `).join("");
}

async function addProduct(){

  const name = document.getElementById("productName").value.trim();
  const price = Number(document.getElementById("productPrice").value || 0);
  const cost = Number(document.getElementById("productCost").value || 0);
  const image_url = document.getElementById("productImage").value.trim();
  const description =
    document.getElementById("productDescription").value.trim();
  const sizes =
  document.getElementById("productSizes").value
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);

const colors =
  document.getElementById("productColors").value
    .split(",")
    .map(x => x.trim())
    .filter(Boolean);

  if(!name){
    alert("กรุณาใส่ชื่อสินค้า");
    return;
  }

  const { error } = await supabaseClient
    .from("products")
    .insert({
      name,
      price,
      cost,
      image_url,
    description,
    sizes,
    colors,
    active:true
    });

  if(error){
    console.error(error);
    alert("เพิ่มสินค้าไม่สำเร็จ");
    return;
  }

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productCost").value = "";
  document.getElementById("productImage").value = "";
  document.getElementById("productDescription").value = "";

  loadProducts();
}

async function toggleProduct(id, currentStatus){

  const { error } = await supabaseClient
    .from("products")
    .update({
      active: !currentStatus
    })
    .eq("id", id);

  if(error){
    console.error(error);
    alert("เปลี่ยนสถานะสินค้าไม่สำเร็จ");
    return;
  }

  loadProducts();
}

async function deleteProduct(id){

  if(!confirm("ยืนยันลบสินค้านี้?")) return;

  const { error } = await supabaseClient
    .from("products")
    .delete()
    .eq("id", id);

  if(error){
    console.error(error);
    alert("ลบสินค้าไม่สำเร็จ");
    return;
  }

  loadProducts();
}
async function loadOrders(){
  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at", {ascending:false});

  if(error){
    console.error(error);
    document.getElementById("ordersList").innerHTML = "<p>ไม่สามารถโหลดออเดอร์ได้</p>";
    return;
  }

  allOrders = data || [];

  // เมื่อขึ้นเดือนใหม่ จะกลับมาแสดงเดือนปัจจุบันให้อัตโนมัติ
  const nowMonth = currentMonthKey();
  if(!lastMonthKey) lastMonthKey = nowMonth;

  if(nowMonth !== lastMonthKey){
    lastMonthKey = nowMonth;
    historyMode = false;
    selectedMonthKey = nowMonth;
  }

  if(!selectedMonthKey) selectedMonthKey = nowMonth;

  updateHistoryOptions();
  renderOrders();
}

function updateHistoryOptions(){
  const select = document.getElementById("historySelect");
  const monthKeys = [...new Set(allOrders.map(o => monthKey(o.created_at)))];

  const now = currentMonthKey();
  if(!monthKeys.includes(now)) monthKeys.push(now);

  monthKeys.sort((a,b) => b.localeCompare(a));

  select.innerHTML = monthKeys.map(key =>
    `<option value="${key}" ${key === selectedMonthKey ? "selected" : ""}>${monthLabel(key)}</option>`
  ).join("");
}

function showCurrentMonth(){
  historyMode = false;
  selectedMonthKey = currentMonthKey();
  lastMonthKey = selectedMonthKey;
  document.getElementById("historySelect").style.display = "none";
  document.getElementById("ordersTitle").innerHTML =
    `ออเดอร์เดือนปัจจุบัน <span class="current-month">(${monthLabel(selectedMonthKey)})</span>`;
  renderOrders();
}

function showHistory(){
  historyMode = true;
  updateHistoryOptions();
  document.getElementById("historySelect").style.display = "block";

  const select = document.getElementById("historySelect");
  if(!select.value){
    select.value = selectedMonthKey;
  }
  selectedMonthKey = select.value;

  document.getElementById("ordersTitle").textContent =
    `ประวัติออเดอร์ (${monthLabel(selectedMonthKey)})`;

  renderOrders();
}

function selectHistoryMonth(key){
  selectedMonthKey = key;
  historyMode = true;
  document.getElementById("ordersTitle").textContent =
    `ประวัติออเดอร์ (${monthLabel(selectedMonthKey)})`;
  renderOrders();
}

function renderOrders(){
  const monthOrders = allOrders.filter(order =>
    monthKey(order.created_at) === selectedMonthKey
  );

  document.getElementById("totalOrders").textContent = monthOrders.length;

  let sales = 0;
let cost = 0;
let profit = 0;
  let waiting = 0;

  monthOrders.forEach(order => {
    sales += Number(order.total || 0);
    cost += Number(order.cost || 0);
    if(order.status === "รอชำระเงิน") waiting++;
  });

  document.getElementById("totalSales").textContent =
    "฿" + sales.toLocaleString("th-TH");
profit = sales - cost;

document.getElementById("totalCost").textContent =
  "฿" + cost.toLocaleString("th-TH");

document.getElementById("totalProfit").textContent =
  "฿" + profit.toLocaleString("th-TH");
  document.getElementById("waitingOrders").textContent = waiting;

  if(!monthOrders.length){
    document.getElementById("ordersList").innerHTML =
      `<p>เดือนนี้ยังไม่มีออเดอร์</p>`;
    return;
  }

  document.getElementById("ordersList").innerHTML = monthOrders.map(order => `
    <div class="order">
      <div class="order-head">
        <strong>${order.order_number}</strong>
        <span class="status">${order.status || "รอชำระเงิน"}</span>
      </div>

      <p>🕒 ${new Date(order.created_at).toLocaleString("th-TH")}</p>
      <p>👤 ${order.customer_name}</p>
      <p>📞 ${order.customer_phone}</p>
      <p>📦 ${order.items}</p>
      <p>💰 ฿${Number(order.total).toLocaleString("th-TH")}</p>
<p>📍 ${order.address}</p>

${order.slip_url ? `
  <a href="${order.slip_url}" target="_blank"
     style="display:inline-block;margin-top:10px;padding:10px 15px;background:#8b3dff;color:white;border-radius:8px;text-decoration:none;font-weight:bold;">
    🧾 ดูสลิปการโอนเงิน
  </a>
` : `
  <p style="color:#888;">ยังไม่มีสลิป</p>
`}

      <select onchange="updateStatus('${order.id}',this.value)">
        <option ${order.status==="รอชำระเงิน"?"selected":""}>รอชำระเงิน</option>
        <option ${order.status==="กำลังเตรียมสินค้า"?"selected":""}>กำลังเตรียมสินค้า</option>
        <option ${order.status==="จัดส่งแล้ว"?"selected":""}>จัดส่งแล้ว</option>
        <option ${order.status==="เสร็จสิ้น"?"selected":""}>เสร็จสิ้น</option>
      </select>

      <button
        onclick="deleteOrder('${order.id}')"
        style="margin-top:10px;background:#8b1e1e;color:white;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;"
      >
        🗑 ลบออเดอร์
      </button>
    </div>
  `).join("");
}

function filterOrders(status){
  document.querySelectorAll(".order").forEach(order => {
    const currentStatus = order.querySelector(".status").textContent.trim();
    order.style.display =
      (status === "ทั้งหมด" || currentStatus === status) ? "" : "none";
  });
}

async function updateStatus(id,status){
  const { error } = await supabaseClient
    .from("orders")
    .update({status})
    .eq("id",id);

  if(error){
    alert("เปลี่ยนสถานะไม่สำเร็จ");
    console.error(error);
    return;
  }

  loadOrders();
}

async function deleteOrder(id){
  if(!confirm("ยืนยันลบออเดอร์นี้?")) return;

  const { error } = await supabaseClient
    .from("orders")
    .delete()
    .eq("id", id);

  if(error){
    console.error(error);
    alert("ลบออเดอร์ไม่สำเร็จ");
    return;
  }

  alert("ลบออเดอร์แล้ว");
  loadOrders();
}

setInterval(loadOrders, 5000);
</script>
</body>
</html>
